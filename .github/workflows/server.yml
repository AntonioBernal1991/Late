# R08: pruebas e integración continua del servidor.
# En cada push o pull request que toque server/ o shared/: compila, pasa las pruebas de integración
# contra un MySQL real (Testcontainers usa el Docker del runner) y construye la imagen Docker.

name: Servidor

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "shared/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

jobs:
  test:
    name: Pruebas de la API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar
        run: dotnet restore server/Late.Server.slnx

      - name: Compilar
        run: dotnet build server/Late.Server.slnx --no-restore -c Release

      - name: Pruebas (xUnit + MySQL en Testcontainers)
        run: >
          dotnet test server/Late.Server.slnx --no-build -c Release
          --logger "trx;LogFileName=resultados.trx"
          --results-directory server/TestResults

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-servidor
          path: server/TestResults

  docker:
    name: Imagen Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen de la API
        run: docker build -f server/Dockerfile -t late-api:${{ github.sha }} .
