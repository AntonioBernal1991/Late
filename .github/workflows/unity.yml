# R08: pruebas del juego (Unity Test Framework, modo editor) y builds de Android y Windows con GameCI.
#
# Necesita la licencia de Unity como secretos del repositorio (Settings › Secrets and variables › Actions):
#   UNITY_LICENSE   contenido del archivo .ulf de la licencia Personal
#   UNITY_EMAIL     email de la cuenta de Unity
#   UNITY_PASSWORD  contraseña de la cuenta de Unity
# Cómo obtener el .ulf: https://game.ci/docs/github/activation
#
# Solo se lanza a mano (Actions › Juego › Run workflow): cada ejecución descarga los recursos de Git LFS
# (~150 MB) y la cuota gratuita de GitHub es de 1 GB al mes. La caché evita descargarlos otra vez
# mientras no cambien.

name: Juego

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Además de las pruebas, generar las builds de Android y Windows"
        type: boolean
        default: false

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  test:
    name: Pruebas del juego
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar la licencia
        if: env.UNITY_LICENSE == ''
        run: |
          echo "::error::Falta el secreto UNITY_LICENSE. Ver las instrucciones al principio de .github/workflows/unity.yml"
          exit 1

      - uses: actions/checkout@v4

      # Git LFS con caché: solo se descarga lo que haya cambiado.
      - name: Lista de archivos LFS
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull

      - uses: actions/cache@v4
        with:
          path: LateGame/Library
          key: Library-${{ hashFiles('LateGame/Assets/**', 'LateGame/Packages/**', 'LateGame/ProjectSettings/**', 'shared/**') }}
          restore-keys: Library-

      - name: Pruebas (EditMode)
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: LateGame
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Resultados de las pruebas del juego

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-juego
          path: artifacts

  build:
    name: Build ${{ matrix.target }}
    needs: test
    if: inputs.build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [Android, StandaloneWindows64]
    steps:
      - uses: actions/checkout@v4
      - name: Lista de archivos LFS
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull

      - uses: actions/cache@v4
        with:
          path: LateGame/Library
          key: Library-${{ matrix.target }}-${{ hashFiles('LateGame/Assets/**', 'LateGame/Packages/**', 'LateGame/ProjectSettings/**', 'shared/**') }}
          restore-keys: Library-${{ matrix.target }}-

      - uses: game-ci/unity-builder@v4
        with:
          projectPath: LateGame
          targetPlatform: ${{ matrix.target }}
          buildName: Late

      - uses: actions/upload-artifact@v4
        with:
          name: Late-${{ matrix.target }}
          path: build/${{ matrix.target }}
